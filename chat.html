<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --user-bg: #dbeafe;
        --bot-bg: #f3f4f6;
        --error: #b91c1c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 2rem;
      }

      .chat-box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        padding: 16px;
      }

      .messages {
        min-height: 220px;
        max-height: 420px;
        overflow-y: auto;
        margin-bottom: 16px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fafafa;
      }

      .message {
        margin: 10px 0;
        padding: 10px 12px;
        border-radius: 10px;
        max-width: 85%;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .message.user {
        background: var(--user-bg);
        margin-left: auto;
      }

      .message.bot {
        background: var(--bot-bg);
      }

      .composer {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 12px 14px;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      button {
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        padding: 12px 18px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--primary-dark);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .meta {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .error {
        margin-top: 12px;
        color: var(--error);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>AI Chat</h1>
      <div class="chat-box">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form">
          <div class="composer">
            <input
              id="message-input"
              type="text"
              placeholder="Ask about this site..."
              autocomplete="off"
              aria-label="Message"
            />
            <button id="send-button" type="submit">Send</button>
          </div>
        </form>

        <div id="usage" class="meta"></div>
        <div id="error" class="error" aria-live="assertive"></div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message-input');
      const sendButton = document.getElementById('send-button');
      const usageEl = document.getElementById('usage');
      const errorEl = document.getElementById('error');

      function addMessage(text, sender) {
        const messageEl = document.createElement('div');
        messageEl.className = `message ${sender}`;
        messageEl.textContent = text;
        messagesEl.appendChild(messageEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function setSendingState(isSending) {
        sendButton.disabled = isSending;
        sendButton.textContent = isSending ? 'Thinking...' : 'Send';
      }

      function updateUsage(data) {
        if (!data || !data.usage) {
          usageEl.textContent = '';
          return;
        }

        const usage = data.usage;
        usageEl.textContent = `Prompt: ${usage.prompt_tokens ?? 0} | Completion: ${usage.completion_tokens ?? 0} | Total: ${usage.total_tokens ?? 0}`;
      }

      async function sendMessage(event) {
        event.preventDefault();

        const message = input.value.trim();
        if (!message || sendButton.disabled) {
          return;
        }

        addMessage(message, 'user');
        input.value = '';
        errorEl.textContent = '';
        setSendingState(true);

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data && data.error ? data.error : 'Request failed');
          }

          const reply = data && data.reply ? data.reply : 'No reply received.';
          addMessage(reply, 'bot');
          updateUsage(data);
        } catch (error) {
          errorEl.textContent = error && error.message ? error.message : 'Something went wrong.';
        } finally {
          setSendingState(false);
          input.focus();
        }
      }

      form.addEventListener('submit', sendMessage);

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
